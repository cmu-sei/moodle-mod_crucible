name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # Changes only under .github/ or tests/ never reach a site, so they neither bump the
      # version nor cut a release. Anything else does both, as before.
      - name: Check whether the plugin itself changed
        id: scope
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE '^(\.github|tests)/'; then
              echo "plugin=true" >> "$GITHUB_OUTPUT"
          else
              echo "Only CI or test files changed; no version bump needed"
              echo "plugin=false" >> "$GITHUB_OUTPUT"
          fi

      - id: get_latest
        if: steps.scope.outputs.plugin == 'true'
        uses: pozetroninc/github-action-get-latest-release@v0.8.0
        with:
          owner: cmu-sei
          repo: moodle-mod_crucible
          excludes: prerelease, draft

      - name: Auto-increment version if needed
        if: steps.scope.outputs.plugin == 'true'
        run: |
          OLDRELEASE=${{ steps.get_latest.outputs.release }}
          PREVIOUSVERSION=$(grep "plugin->version" version.php | sed -e "s/.*= \(.*\);.*/\1/")
          if [ $OLDRELEASE -ne $PREVIOUSVERSION ]; then
              echo "Version already updated in PR"
              exit 0
          fi
          OLDDATE=$(echo $PREVIOUSVERSION | cut -b 1-8)
          NEWDATE=$(date +%Y%m%d)
          if [ $OLDDATE -ne $NEWDATE ]; then
              NEWVERSION=$NEWDATE\00
          else
              OLDVERS=$(echo $PREVIOUSVERSION | cut -b 9-10)
              OLDVERS=${OLDVERS#0}
              let NEWVERS=(OLDVERS + 1)
              NEWVERSION=$OLDDATE$(printf %02d $NEWVERS)
          fi
          sed -i "s#\(plugin->version.*\)$PREVIOUSVERSION#\1$NEWVERSION#" version.php
          echo "FILESCHANGED=TRUE" >> $GITHUB_ENV
          echo "Version bumped to $NEWVERSION"

      - name: Commit version bump
        if: env.FILESCHANGED == 'TRUE'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.php
          git commit -m "Auto-increment version"

      - name: Push version bump to PR
        if: env.FILESCHANGED == 'TRUE'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Changes only under .github/ or tests/ never reach a site, so they neither bump the
      # version nor cut a release. Anything else does both, as before.
      - name: Check whether the plugin itself changed
        id: scope
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qvE '^(\.github|tests)/'; then
              echo "plugin=true" >> "$GITHUB_OUTPUT"
          else
              echo "Only CI or test files changed; no release needed"
              echo "plugin=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get version from version.php
        if: steps.scope.outputs.plugin == 'true'
        id: get_version
        run: |
          VERSION=$(grep "plugin->version" version.php | sed -e "s/.*= \(.*\);.*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Package plugin
        if: steps.scope.outputs.plugin == 'true'
        run: |
          mkdir -p /tmp/package
          rsync -av --exclude='.git*' --exclude='vendor/' --exclude='node_modules/' ./ /tmp/package/crucible/
          cd /tmp/package
          zip -r mod_crucible_${{ steps.get_version.outputs.version }}.zip crucible/
          mv mod_crucible_${{ steps.get_version.outputs.version }}.zip $GITHUB_WORKSPACE/

      - name: Create Release
        if: steps.scope.outputs.plugin == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: mod_crucible_${{ steps.get_version.outputs.version }}
          files: mod_crucible_${{ steps.get_version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
