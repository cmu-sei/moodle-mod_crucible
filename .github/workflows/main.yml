name: CI

# A release is cut when a merge to main raises $plugin->version in version.php. Merges that leave
# the version alone land on main without a release, so fixes can collect until someone bumps it.
# Nothing here pushes to a pull request branch: a bot commit there would hold the PR's workflow
# runs for manual approval.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A reminder only: not every change needs a release, and the bump is the author's call.
      - name: Warn when the plugin changed without a version bump
        run: |
          BASE="origin/${{ github.base_ref }}"
          if ! git diff --name-only "$BASE...HEAD" | grep -qvE '^(\.github|tests)/'; then
              echo "Only CI or test files changed"
              exit 0
          fi
          OLDVERSION=$(git show "$BASE:version.php" | grep "plugin->version" | sed -e "s/.*= \(.*\);.*/\1/")
          NEWVERSION=$(grep "plugin->version" version.php | sed -e "s/.*= \(.*\);.*/\1/")
          if [ "$NEWVERSION" -gt "$OLDVERSION" ]; then
              echo "Version bumped to $NEWVERSION; merging this releases it"
          else
              echo "::warning file=version.php::Plugin files changed but \$plugin->version is still $OLDVERSION. Merging will not cut a release; bump it if this should ship, and always if it adds an upgrade step."
          fi

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from version.php
        id: get_version
        run: |
          VERSION=$(grep "plugin->version" version.php | sed -e "s/.*= \(.*\);.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # Releases are tagged with the version number, so an existing tag means this version shipped.
      - name: Check whether this version was already released
        id: scope
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.get_version.outputs.version }}" > /dev/null; then
              echo "Version ${{ steps.get_version.outputs.version }} is already released; nothing to do"
              echo "release=false" >> "$GITHUB_OUTPUT"
          else
              echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package plugin
        if: steps.scope.outputs.release == 'true'
        run: |
          mkdir -p /tmp/package
          rsync -av --exclude='.git*' --exclude='vendor/' --exclude='node_modules/' ./ /tmp/package/crucible/
          cd /tmp/package
          zip -r mod_crucible_${{ steps.get_version.outputs.version }}.zip crucible/
          mv mod_crucible_${{ steps.get_version.outputs.version }}.zip "$GITHUB_WORKSPACE/"

      - name: Create Release
        if: steps.scope.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: mod_crucible_${{ steps.get_version.outputs.version }}
          files: mod_crucible_${{ steps.get_version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
